    ja: {description: "Codex や Claude Code などのコーディングエージェントをブラウザーで。NAS から提供"}
    ko: {description: "Codex, Claude Code 같은 코딩 에이전트를 브라우저에서. NAS에서 제공"}
    de: {description: "Coding-Agenten wie Codex und Claude Code im Browser, bereitgestellt von Ihrem NAS"}
    fr: {description: "Les agents de code comme Codex et Claude Code dans votre navigateur, servis par votre NAS"}
    es: {description: "Agentes de código como Codex y Claude Code en tu navegador, servidos desde tu NAS"}
