# T3 Code for DSM: upstream's T3 Code server and web app in one container,
# behind DSM administrator sign-in. Upstream files stay unchanged; everything
# DSM-specific lives in synology/. `synopkgland build` reads this file.
schema: 2

package: T3Code
version: 0.1.7
# The build resets to 1 with every upstream release (INFO <upstream>-0001).
build: 10
displayname: T3 Code
description: A browser console for coding agents such as Codex and Claude Code. Install the agents you want yourself. On a NAS with less than 4 GB of memory, run agents on another computer or use a lightweight one such as Pi
# The upstream owner is the maintainer; Syno Package Land is the distributor.
maintainer: pingdotgg
# Upstream's own app icon, unchanged (assets/icon-source.json).
icon: assets/t3code-icon.png
os_min_ver: "7.2.1-69057"
# Upstream publishes glibc Linux builds for x86_64 and aarch64 only, and
# Container Manager is required. Of the aarch64 platforms only rtd1619b runs
# Container Manager; the others fail the SDK's Container Manager preflight
# with its install message (arches cannot name single platforms).
arches: [x86_64, aarch64]

# Administrators only: the terminal and the agents act as the package account
# on every file in the selected Shared Folder, so all administrators share one
# T3 Code instance and its agent sign-ins.
entry: admin-only
ui: {launch: new-page}
capabilities: {composeMounts: true}

install:
  # MemTotal in MiB: 2 GB machines report about 1.75 GB and can install.
  min_memory_mb: 1700
  # Below about 85% of 4 GB (4 GB machines report about 3.7 GB) the install
  # wizard warns, without blocking, that agents run slowly on the NAS and
  # points to a remote environment (messages/install.recommended_memory_message).
  recommended_memory_mb: 3400
  # The gateway's HTTPS port is chosen in the install wizard.
  ports: true
  # The selected folder is both the persistent home and the project workspace.
  sharedFolder: {mode: select, key: workspace, permission: rw, picker: folder}

compose:
  sdk: 0.53.26
  files: [compose.yaml, compose.image.yaml]
  # Token adapter for the gateway (helper/), one static binary per arch.
  helpers: {x86_64: .build/helpers/x86_64, aarch64: .build/helpers/aarch64}
  # T3 Code's unauthenticated environment descriptor; t3-gate lets only this
  # path through without the gateway key. `/health` is the SPA fallback page.
  web: {service: t3code, port: 8080, health: {path: /.well-known/t3/environment, status: 200}}
  # Agents are installed, updated and used over the internet.
  network: {egress: internet}
  shares:
    workspace:
      select: install
      picker: folder
      permission: rw
      mounts: [{service: t3code, target: /data/home}, {service: t3code, target: /workspace}]
  services:
    t3code:
      # The package UID runs T3 Code, its terminal and agents; only an explicit
      # `sudo ...` runs as container root (for example `sudo apt-get install`).
      run_as:
        mode: package
        sudo: {reason: "Install build tools with apt for coding agents"}
      # The SDK's container init gives the package UID an account entry, HOME,
      # TMPDIR and private credential file modes on every start.
      console: {home: /data/home, user: synopkg}
      # Temporary files (agents, npm, Chrome) go to disk, emptied at every start;
      # TMPDIR points here. /tmp stays the image's own directory.
      scratch: [/scratch]
      storage_init:
        runtime:
          environment:
            # Per-install key t3-gate requires; t3-key sends the same value.
            T3_GATE_KEY: {secret: gateway-key}

identity_gateway:
  sdk: 0.53.26
  # After DSM admits an administrator, t3-key adds the gateway key and t3-gate
  # adds T3 Code's own session, so there is no T3 pairing step.
  mode: token
  access: dsm-admins
  token: {exec: t3-key}
  # T3 Code's web app builds every URL from the origin root (/assets, /api,
  # /ws, /.well-known, /oauth) and has no base-path setting, so it needs a
  # dedicated HTTPS port (DSM's certificate) instead of a DSM path.
  listen: {https: 23773}

metadata:
  license: MIT
  homepage: https://t3.codes/
  source_url: https://github.com/synopackageland/syno-pkg-land-t3code
  issues_url: https://github.com/synopackageland/syno-pkg-land-t3code/issues
  maintainer_url: https://github.com/pingdotgg
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
  upstream:
    name: t3code
    url: https://github.com/pingdotgg/t3code
  long_description:
    en: |-
      T3 Code is a browser console for coding agents. Run Codex, Claude Code, Pi, OpenCode and
      other supported agents on your Synology NAS, and work with them from any browser on your
      network: chat with agents, review their changes and use a built-in terminal.
      No agent is included. Install the agents you want from T3 Code's setup wizard or its
      terminal, then sign in with your own subscription or API key. Agents are kept in the
      package's own storage, so you can update them as soon as new versions are released.
      Projects are stored in the shared folder you choose during installation.
      Container Manager is required. Only DSM administrators can open T3 Code, and all
      administrators share one T3 Code instance, including its agent sign-ins. T3 Connect,
      device pairing and usage data are turned off, and T3 Code is updated only through
      Package Center. To use it outside your local network, connect through a VPN.
    zh-TW: |-
      T3 Code 是 coding agent 的瀏覽器控制台。可在 Synology NAS 上執行 Codex、Claude Code、Pi、
      OpenCode 等支援的 agent，並從區域網路中的任何瀏覽器操作：與 agent 對話、檢視其變更，
      以及使用內建終端機。
      套件不含任何 agent。請從 T3 Code 的設定精靈或終端機自行安裝所需的 agent，再以您自己的
      訂閱或 API 金鑰登入。agent 存放於套件專屬的儲存空間，新版本推出時即可自行更新。專案
      存放於安裝時選擇的共用資料夾。
      需要 Container Manager。僅 DSM 管理員可開啟 T3 Code，所有管理員共用同一個 T3 Code
      實例及其 agent 登入。T3 Connect、裝置配對與使用資料皆已關閉，T3 Code 僅透過套件中心
      更新。若要在區域網路外使用，請透過 VPN 連線。
    zh-CN: |-
      T3 Code 是 coding agent 的浏览器控制台。可在 Synology NAS 上运行 Codex、Claude Code、Pi、
      OpenCode 等支持的 agent，并从局域网中的任何浏览器操作：与 agent 对话、查看其更改，
      以及使用内置终端。
      套件不含任何 agent。请从 T3 Code 的设置向导或终端自行安装所需的 agent，再使用您自己的
      订阅或 API 密钥登录。agent 存放在套件专用的存储空间中，新版本发布后即可自行更新。项目
      存放在安装时选择的共享文件夹中。
      需要 Container Manager。仅 DSM 管理员可打开 T3 Code，所有管理员共用同一个 T3 Code
      实例及其 agent 登录。T3 Connect、设备配对和使用数据均已关闭，T3 Code 仅通过套件中心
      更新。如需在局域网外使用，请通过 VPN 连接。
    ja: |-
      T3 Code はコーディングエージェント用のブラウザーコンソールです。Synology NAS 上で
      Codex、Claude Code、Pi、OpenCode などの対応エージェントを実行し、ネットワーク内の
      ブラウザーから操作できます。エージェントとの対話、変更内容の確認、内蔵ターミナルの
      使用が可能です。
      エージェントは含まれていません。T3 Code のセットアップウィザードまたはターミナルから
      必要なエージェントをインストールし、ご自身のサブスクリプションまたは API キーでサイン
      インしてください。エージェントはパッケージ専用のストレージに保存されるため、新しい
      バージョンがリリースされたらすぐに更新できます。プロジェクトはインストール時に選択
      した共有フォルダに保存されます。
      Container Manager が必要です。T3 Code を開けるのは DSM 管理者のみで、すべての管理者が
      1 つの T3 Code インスタンスとそのエージェントのサインインを共有します。T3 Connect、
      デバイスのペアリング、利用データはオフで、T3 Code はパッケージセンターからのみ更新
      されます。ローカルネットワーク外から使用するには VPN で接続してください。
    ko: |-
      T3 Code는 코딩 에이전트를 위한 브라우저 콘솔입니다. Synology NAS에서 Codex, Claude Code,
      Pi, OpenCode 등 지원되는 에이전트를 실행하고 네트워크의 모든 브라우저에서 사용할 수
      있습니다. 에이전트와 대화하고, 변경 내용을 검토하고, 내장 터미널을 사용할 수 있습니다.
      에이전트는 포함되어 있지 않습니다. T3 Code의 설정 마법사나 터미널에서 원하는 에이전트를
      직접 설치한 후 본인의 구독 또는 API 키로 로그인하세요. 에이전트는 패키지 전용 저장
      공간에 보관되므로 새 버전이 출시되면 바로 업데이트할 수 있습니다. 프로젝트는 설치 시
      선택한 공유 폴더에 저장됩니다.
      Container Manager가 필요합니다. DSM 관리자만 T3 Code를 열 수 있으며, 모든 관리자가 하나의
      T3 Code 인스턴스와 에이전트 로그인을 공유합니다. T3 Connect, 장치 페어링, 사용 데이터는
      꺼져 있으며 T3 Code는 패키지 센터를 통해서만 업데이트됩니다. 로컬 네트워크 밖에서
      사용하려면 VPN으로 연결하세요.
    de: |-
      T3 Code ist eine Browser-Konsole für Coding-Agenten. Führen Sie Codex, Claude Code, Pi,
      OpenCode und andere unterstützte Agenten auf Ihrem Synology NAS aus und arbeiten Sie mit
      ihnen in jedem Browser in Ihrem Netzwerk: Chatten Sie mit Agenten, prüfen Sie ihre
      Änderungen und nutzen Sie das integrierte Terminal.
      Es ist kein Agent enthalten. Installieren Sie die gewünschten Agenten über den
      Einrichtungsassistenten oder das Terminal von T3 Code und melden Sie sich mit Ihrem
      eigenen Abonnement oder API-Schlüssel an. Agenten werden im eigenen Speicher des Pakets
      abgelegt, sodass Sie sie aktualisieren können, sobald neue Versionen erscheinen.
      Projekte werden im freigegebenen Ordner gespeichert, den Sie bei der Installation wählen.
      Container Manager ist erforderlich. Nur DSM-Administratoren können T3 Code öffnen, und
      alle Administratoren teilen sich eine T3 Code-Instanz einschließlich der
      Agenten-Anmeldungen. T3 Connect, Gerätekopplung und Nutzungsdaten sind deaktiviert, und
      T3 Code wird nur über das Paket-Zentrum aktualisiert. Für die Nutzung außerhalb Ihres
      lokalen Netzwerks verbinden Sie sich über ein VPN.
    fr: |-
      T3 Code est une console web pour les agents de code. Exécutez Codex, Claude Code, Pi,
      OpenCode et d'autres agents pris en charge sur votre Synology NAS, et utilisez-les depuis
      n'importe quel navigateur de votre réseau : discutez avec les agents, examinez leurs
      modifications et utilisez le terminal intégré.
      Aucun agent n'est inclus. Installez les agents de votre choix depuis l'assistant de
      configuration ou le terminal de T3 Code, puis connectez-vous avec votre propre abonnement
      ou clé API. Les agents sont conservés dans le stockage propre au paquet ; vous pouvez donc
      les mettre à jour dès la sortie de nouvelles versions. Les projets sont stockés dans le
      dossier partagé choisi lors de l'installation.
      Container Manager est requis. Seuls les administrateurs DSM peuvent ouvrir T3 Code, et
      tous les administrateurs partagent une même instance de T3 Code, y compris ses
      connexions aux agents. T3 Connect, l'appairage d'appareils et les données d'utilisation
      sont désactivés, et T3 Code est mis à jour uniquement via le Centre de paquets. Pour
      l'utiliser hors de votre réseau local, connectez-vous via un VPN.
    es: |-
      T3 Code es una consola web para agentes de código. Ejecute Codex, Claude Code, Pi,
      OpenCode y otros agentes compatibles en su Synology NAS y úselos desde cualquier
      navegador de su red: converse con los agentes, revise sus cambios y use el terminal
      integrado.
      No se incluye ningún agente. Instale los agentes que desee desde el asistente de
      configuración o el terminal de T3 Code e inicie sesión con su propia suscripción o clave
      de API. Los agentes se guardan en el almacenamiento propio del paquete, por lo que puede
      actualizarlos en cuanto se publiquen nuevas versiones. Los proyectos se guardan en la
      carpeta compartida que elija durante la instalación.
      Se requiere Container Manager. Solo los administradores de DSM pueden abrir T3 Code, y
      todos los administradores comparten una misma instancia de T3 Code, incluidos sus inicios
      de sesión de agentes. T3 Connect, el emparejamiento de dispositivos y los datos de uso
      están desactivados, y T3 Code solo se actualiza desde el Centro de paquetes. Para usarlo
      fuera de su red local, conéctese mediante una VPN.
    it: |-
      T3 Code è una console web per gli agenti di coding. Esegui Codex, Claude Code, Pi,
      OpenCode e altri agenti supportati sul tuo Synology NAS e usali da qualsiasi browser della
      tua rete: conversa con gli agenti, esamina le loro modifiche e usa il terminale integrato.
      Nessun agente è incluso. Installa gli agenti che desideri dalla procedura guidata di
      configurazione o dal terminale di T3 Code, quindi accedi con il tuo abbonamento o la tua
      chiave API. Gli agenti sono conservati nello spazio di archiviazione del pacchetto, quindi
      puoi aggiornarli appena escono nuove versioni. I progetti sono salvati nella cartella
      condivisa scelta durante l'installazione.
      È richiesto Container Manager. Solo gli amministratori DSM possono aprire T3 Code e tutti
      gli amministratori condividono un'unica istanza di T3 Code, inclusi gli accessi agli
      agenti. T3 Connect, l'abbinamento dei dispositivi e i dati di utilizzo sono disattivati e
      T3 Code viene aggiornato solo tramite il Centro pacchetti. Per usarlo al di fuori della
      rete locale, connettiti tramite VPN.
